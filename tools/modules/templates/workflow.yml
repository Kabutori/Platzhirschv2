name: Module package checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r -n1 php -l
      - name: Check tagged version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          if os.environ['REF_TYPE']=='tag':
              for p in json.loads(Path('module.json').read_text())['packages']:
                  assert 'v'+p['version']==os.environ['REF_NAME'], 'Tag differs from package version'
          PY
      - run: python tools/package.py
      - run: cd dist && sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: module-packages
          path: dist/*
          if-no-files-found: error
  release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: module-packages
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes 'Versioned module packages. Integration tests and Windows deployment run in Platzhirschv2.' --latest=false
