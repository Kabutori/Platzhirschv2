name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: application-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, pdo_sqlite, mbstring, intl, openssl, zip
          tools: composer:v2
          coverage: none
      - name: Prepare writable runtime directories
        run: mkdir -p app/storage/logs app/storage/framework/{sessions,views,cache} app/bootstrap/cache
      - run: composer install --no-interaction --prefer-dist
        working-directory: app
      - name: PHP syntax
        run: find app/app app/packages app/config app/database app/routes app/tests installer -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
        working-directory: app
      - name: Real SMTP STARTTLS delivery, registration and invoice flow
        env:
          PLATZHIRSCH_SMTP_TEST_DIRECTORY: /tmp/platzhirsch-smtp-test
        run: |
          mkdir -p "$PLATZHIRSCH_SMTP_TEST_DIRECTORY"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$PLATZHIRSCH_SMTP_TEST_DIRECTORY/key.pem" -out "$PLATZHIRSCH_SMTP_TEST_DIRECTORY/cert.pem" -days 1 -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          python tools/mail/test_smtp.py --directory "$PLATZHIRSCH_SMTP_TEST_DIRECTORY" &
          SMTP_TEST_PID=$!
          trap 'kill "$SMTP_TEST_PID"' EXIT
          python -c "import socket,time; time.sleep(1); socket.create_connection(('127.0.0.1',25252)).close()"
          cd app
          php -d openssl.cafile="$PLATZHIRSCH_SMTP_TEST_DIRECTORY/cert.pem" vendor/bin/phpunit --filter SmtpDeliveryTest
      - run: composer audit --locked
        working-directory: app
      - name: Render registration views for browser checks
        run: php tools/Render-RegistrationPreview.php
      - uses: actions/upload-artifact@v4
        with:
          name: registration-pages
          path: app/public/landing/preview-*.html
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: app/composer.lock
  frontend:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: npm ci
        working-directory: admin-ui
      - run: node --test packages/mcp/src/server.test.mjs
        working-directory: admin-ui
      - run: npm run build
        working-directory: admin-ui
      - uses: actions/download-artifact@v4
        with:
          name: registration-pages
          path: app/public/landing
      - run: npm audit --omit=dev --audit-level=high
        working-directory: admin-ui
      - run: npx playwright install --with-deps chromium
        working-directory: admin-ui
      - run: npx playwright test
        working-directory: admin-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: role-design-preview
          path: |
            admin-ui/test-results/roles-*.png
            admin-ui/test-results/modules-*.png
            admin-ui/test-results/guide-*.png
            admin-ui/test-results/design-*.png
          if-no-files-found: ignore
  windows-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer with Windows PowerShell 5.1
        shell: powershell
        run: ./tools/Check-PowerShell.ps1
      - name: Test verified module update staging
        shell: powershell
        run: ./tools/Test-ModuleUpdateStage.ps1
      - name: Test automatic development checkout without installed application
        shell: powershell
        run: |
          $package=Join-Path $env:RUNNER_TEMP 'dev-bootstrap-package'
          New-Item -ItemType Directory -Path "$package\development" -Force|Out-Null
          Copy-Item Start-Development.bat $package
          Copy-Item development/Prepare-Development.ps1 "$package\development"
          ./tools/Test-DevelopmentBootstrap.ps1 -PackagePath $package

  module-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/modules -p 'test_*.py'
      - run: python tools/modules/sources.py verify
      - run: python tools/modules/packages.py --check
      - run: python tools/modules/packages.py --output dist/modules
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring, intl, openssl, zip
          tools: composer:v2
          coverage: none
      - name: Install PHP modules from independent archives
        run: |
          mkdir -p app/storage/logs app/storage/framework/{sessions,views,cache} app/bootstrap/cache
          python - <<'PYCODE'
          import json, shutil
          from pathlib import Path
          archives = Path('dist/php-artifacts')
          archives.mkdir()
          for archive in Path('dist/modules').glob('*.zip'):
              shutil.copy2(archive, archives / archive.name)
          p = Path('app/composer.json')
          data = json.loads(p.read_text())
          data['repositories'] = [{'type': 'artifact', 'url': str(archives.resolve())}]
          p.write_text(json.dumps(data, indent=2))
          Path('app/composer.lock').unlink(missing_ok=True)
          PYCODE
          composer install --working-dir=app --no-interaction --prefer-dist
          composer test --working-dir=app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build UI from independent npm archives
        run: |
          python - <<'PYCODE'
          import json, shutil, tarfile
          from pathlib import Path
          for archive in Path('dist/modules').glob('*.tgz'):
              with tarfile.open(archive) as t:
                  name = json.load(t.extractfile('package/package.json'))['name']
                  matches = [p.parent for p in Path('admin-ui/packages').glob('*/package.json') if json.loads(p.read_text())['name'] == name]
                  assert len(matches) == 1
                  target = matches[0]
                  staging = Path('dist/unpacked') / target.name
                  t.extractall(staging, filter='data')
                  shutil.rmtree(target)
                  shutil.copytree(staging / 'package', target)
          PYCODE
          npm ci --prefix admin-ui
          npm run build --prefix admin-ui
      - uses: actions/upload-artifact@v4
        with:
          name: independent-module-packages
          path: dist/modules/*
          if-no-files-found: error

  private-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring, intl, openssl, zip, sodium
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compose application through Composer and npm registry protocols
        run: |
          python tools/modules/registry.py seed --output .module-build
          export MODULE_COMPOSITION="$(python -c 'import json; d=json.load(open(".module-build/index.json")); print(json.dumps({k:{"version":v["installed"],"commit":v["versions"][v["installed"]]["commit"]} for k,v in d["repositories"].items()}))')"
          python tools/modules/registry.py compose --output .module-build
          python tools/modules/registry.py serve --output .module-build > /tmp/registry.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:18761/composer/packages.json >/dev/null && break || sleep 1; done
          mkdir -p app/storage/logs app/storage/framework/{sessions,views,cache} app/bootstrap/cache
          composer update 'platzhirsch/*' --working-dir=app --no-interaction --no-install --no-scripts
          composer install --working-dir=app --no-interaction --prefer-dist
          composer test --working-dir=app
          rm admin-ui/package-lock.json
          npm install --prefix admin-ui --package-lock-only --ignore-scripts
          npm ci --prefix admin-ui
          npm run build --prefix admin-ui
