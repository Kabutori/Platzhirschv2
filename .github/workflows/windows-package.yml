name: Windows installation package (preview)
run-name: ${{ inputs.request_id && format('Module composition {0}', inputs.request_id) || 'Windows installation package' }}
on:
  pull_request:
    paths:
      - 'app/**'
      - 'admin-ui/**'
      - 'widget-embed/**'
      - 'landing/**'
      - 'installer/**'
      - 'tools/**'
      - 'docs/**'
      - 'Install.bat'
      - 'Start-Development.bat'
      - 'Create-PullRequest.bat'
      - 'Update.bat'
      - 'Recovery.bat'
      - 'development/**'
      - '.github/workflows/windows-package.yml'
  workflow_dispatch:
    inputs:
      composition:
        description: 'Exact module selection JSON from administration'
        required: false
      request_id:
        description: 'Administration build request UUID'
        required: false
      base_commit:
        description: 'Approved main commit'
        required: false
      version:
        description: Package version
        required: true
        default: '0.1.0-preview.1'
permissions:
  contents: read
concurrency:
  group: windows-package-${{ inputs.request_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, pdo_sqlite, mbstring, intl, openssl, fileinfo, curl, zip, sodium
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare private module registry
        shell: pwsh
        env:
          MODULE_COMPOSITION: ${{ inputs.composition }}
          MODULE_REQUEST_ID: ${{ inputs.request_id }}
          MODULE_BASE_COMMIT: ${{ inputs.base_commit }}
          MODULE_REPOSITORY_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.MODULE_REPOSITORY_TOKEN || '' }}
        run: |
          if ($env:MODULE_COMPOSITION) {
            if ('${{ github.ref }}' -ne 'refs/heads/main' -or $env:MODULE_BASE_COMMIT -ne (git rev-parse HEAD) -or $env:MODULE_REQUEST_ID -notmatch '^[a-f0-9-]{36}$') { throw 'Approved main commit/request required' }
          } else {
            python tools/modules/registry.py seed --output .module-build
            if ($LASTEXITCODE -ne 0) { throw 'Registry seed failed' }
            $env:MODULE_COMPOSITION = python -c 'import json; d=json.load(open(".module-build/index.json")); print(json.dumps({k:{"version":v["installed"],"commit":v["versions"][v["installed"]]["commit"]} for k,v in d["repositories"].items()}))'
          }
          python tools/modules/registry.py compose --output .module-build
          if ($LASTEXITCODE -ne 0) { throw 'Module composition failed' }
          Copy-Item .module-build app/resources/module-registry -Recurse
          $process = Start-Process python -ArgumentList 'tools/modules/registry.py','serve','--output','.module-build' -PassThru -RedirectStandardOutput registry-server.log -RedirectStandardError registry-server.error.log
          for ($i=0; $i -lt 30; $i++) {
            try { Invoke-WebRequest http://127.0.0.1:18761/composer/packages.json -TimeoutSec 2 | Out-Null; break } catch { Start-Sleep -Seconds 1 }
          }
          Push-Location app
          composer update 'platzhirsch/*' --no-install --no-scripts --no-interaction
          if ($LASTEXITCODE -ne 0) { throw 'Composer composition failed' }
          Pop-Location
          Push-Location admin-ui
          Remove-Item package-lock.json
          npm install --package-lock-only --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'npm composition failed' }
          Pop-Location
      - name: Prepare runtime directories
        shell: pwsh
        run: New-Item -ItemType Directory -Force app/storage/logs,app/storage/framework/sessions,app/storage/framework/views,app/storage/framework/cache,app/bootstrap/cache | Out-Null
      - run: composer install --no-interaction --prefer-dist
        working-directory: app
      - run: composer test
        working-directory: app
      - run: composer audit --locked
        working-directory: app
      - run: composer install --no-dev --no-interaction --classmap-authoritative
        working-directory: app
      - run: npm ci
        working-directory: admin-ui
      - run: npm run build
        working-directory: admin-ui
      - run: php tools/Render-RegistrationPreview.php
      - run: npm audit --omit=dev --audit-level=high
        working-directory: admin-ui
      - run: npx playwright install chromium
        working-directory: admin-ui
      - run: npx playwright test
        working-directory: admin-ui
      - run: ./tools/Check-PowerShell.ps1
        shell: powershell
      - name: Package signed manufacturer dependencies
        env:
          PACKAGE_VERSION: ${{ inputs.version || format('0.1.0-preview.{0}', github.run_number) }}
        shell: pwsh
        run: ./tools/Build-WindowsRelease.ps1 -Version $env:PACKAGE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: Platzhirsch-Windows-Preview
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: error
  installation:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Platzhirsch-Windows-Preview
          path: package-download
      - name: Extract installation package
        shell: powershell
        run: |
          $zip = Get-ChildItem package-download -Filter '*.zip' | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($zip.FullName, 'C:\ph-package')
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release development bootstrap
        shell: powershell
        run: ./tools/Test-DevelopmentBootstrap.ps1 -PackagePath C:\ph-package
      - name: Install and test IIS, MySQL and application
        shell: powershell
        run: ./tools/Test-WindowsInstallation.ps1 -PackagePath C:\ph-package
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-2022'
        with:
          name: synthetic-recovery-fixture
          path: C:/ph-recovery-fixture.zip
          retention-days: 1
          if-no-files-found: error
      - name: Test isolated development startup and restart
        shell: powershell
        run: |
          ./Start-Development.bat -RuntimePath C:\ph-ci\runtime -SmokeTest -NoBrowser -LocalComposer
          if($LASTEXITCODE -ne 0){throw 'Development startup failed'}
          $before=(Get-FileHash .development/state.json).Hash
          ./Start-Development.bat -RuntimePath C:\ph-ci\runtime -SmokeTest -NoBrowser -LocalComposer
          if($LASTEXITCODE -ne 0){throw 'Development restart failed'}
          if((Get-FileHash .development/state.json).Hash -ne $before){throw 'Development keys changed'}
          foreach($port in @(5173,8000,33018)){
            if(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue){throw 'Development process leaked'}
          }
  recovery:
    needs: [package, installation]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Platzhirsch-Windows-Preview
          path: package-download
      - uses: actions/download-artifact@v4
        with:
          name: synthetic-recovery-fixture
          path: recovery-download
      - name: Restore onto a clean Windows machine
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-ChildItem package-download -Filter '*.zip' | Select-Object -First 1
          [IO.Compression.ZipFile]::ExtractToDirectory($zip.FullName, 'C:\ph-package')
          ./tools/Test-NewMachineRecovery.ps1 -PackagePath C:\ph-package -Archive (Resolve-Path recovery-download/ph-recovery-fixture.zip)
  publish:
    needs: [package, installation, recovery]
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Platzhirsch-Windows-Preview
          path: package-download
      - name: Publish tested Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: windows-preview-${{ github.run_number }}-${{ github.run_attempt }}
          CHECK_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cd package-download
          sha256sum ./*.zip > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Windows-Vorschau für Platzhirsch. Noch keine Produktionsfreigabe des vollständigen Konzepts.

          Das Asset Platzhirsch-…-windows-x64.zip herunterladen, vollständig entpacken und Install.bat als Administrator ausführen. Die automatisch angebotenen Source-code-Archive enthalten keine Laufzeitpakete.

          Geprüft: PHP-Funktionstests, Frontend und Browsertests; Erstinstallation auf Windows Server 2022 und 2025; getrennte Portale, Testrestaurant, Reservierungen, lokale Sicherung/Wiederherstellung, Modulbestellung mit externer Zahlungsbestätigung, Aktivierung und Reparatur, zweite MySQL-Instanz, Serverzuordnung sowie Restaurantumzug mit Inhaltsvergleich und erhaltener Quelle.

          Entwicklung: Start-Development.bat im vollstaendig entpackten Paket startet die Einrichtung eines separaten Git-Checkouts mit eigenem Branch. PHP/MySQL-Laufzeitdateien einer vorhandenen Installation werden benoetigt; Entwicklungsdaten liegen separat. Kein automatischer Push oder Produktiv-Update. Details in DEVELOPMENT.md.

          Betrieb: Update.bat und Recovery.bat ergänzen Anwendungsupdates der 0.1-Reihe mit Plattform-/Mandantenmigrationen und Datenbank-Rollback sowie koordinierte Sicherung zweier Datenbankserver und Rücksicherung auf einem sauberen Windows-Rechner. Die Pipeline prüft auch beschädigte Archive, fehlgeschlagene Migrationen, 10000 Binärdatenzeilen und begrenzte HTTP-Parallelität. Anleitung: UPDATES-UND-WIEDERHERSTELLUNG.md.

          Ein echter Windows-Neustart, externe TLS-Topologien, automatische Zahlungsanbieter, Laufzeit-/MSI-Versionswechsel und Produktions-Kapazitätsgrenzen sind nicht abgenommen. Die mitgelieferte Neustartprüfung muss auf einer geeigneten Maschine ausgeführt werden.
          NOTES
          printf '\nPrüflauf: %s\nBuild-Commit: %s\n' "$CHECK_URL" "$RELEASE_COMMIT" >> release-notes.md
          gh release create "$RELEASE_TAG" ./*.zip SHA256SUMS.txt --target "$RELEASE_COMMIT" --prerelease --title "Platzhirsch Windows-Vorschau $RELEASE_TAG" --notes-file release-notes.md
